<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTF - Niveau 1 : Portail d'Accès</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .terminal {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 {
            color: #58a6ff;
            font-size: 1.4em;
            margin-top: 0;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }
        p {
            font-size: 0.95em;
            line-height: 1.5;
        }
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: #58a6ff;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            font-size: 1em;
        }
        button:hover {
            background-color: #2ea043;
        }
        #message {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
            word-break: break-all;
        }
        .error { color: #f85149; }
        .success { color: #3fb950; }
    </style>
</head>
<body>
<!-- Note pour les devs : penser à retirer l'accès invité (Pass: Sup3r_S3cr3t_2026) avant la mise en production ! -->
<div class="terminal">
    <h1>[SYSTÈME SÉCURISÉ - NIVEAU 1]</h1>
    <p>Authentification requise pour accéder aux données confidentielles du serveur.</p>
    <input type="password" id="passwordInput" placeholder="Entrez le mot de passe...">
    <button onclick="verifierAcces()">CONNEXION</button>
    <div id="message"></div>
</div>

<script>
    function verifierAcces() {
        const input = document.getElementById("passwordInput").value;
        const msg = document.getElementById("message");
        
        // Le flag est encodé en Base64 pour plus de sécurité ;)
        const secretFlag = "Q1RGe0luc3AzY3Qzcl9MZV9Db2QzX1NvdXJjM19DM3N0X0xhX0Jhc2V9";

        if (input === "Sup3r_S3cr3t_2026") {
            msg.className = "success";
            // La fonction atob() décode le Base64
            msg.innerText = "Accès autorisé ! Voici votre flag : " + atob(secretFlag);
        } else {
            msg.className = "error";
            msg.innerText = "Accès refusé : Mot de passe incorrect.";
        }
    }
</script>

</body>
</html>
